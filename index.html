<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026服務廠微笑大使 幸運抽獎</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-bg: #f6f0e1;
        --color-bg-alt: #efe6d0;
        --color-panel: #fffdf8;
        --color-ink: #2a2018;
        --color-ink-soft: #6b5d4d;
        --color-wine: #7a1e2e;
        --color-wine-dark: #55131e;
        --color-gold: #a97c2f;
        --color-gold-light: #e8d9af;
        --color-gold-bright: #d6a94a;
        --font-display: "Noto Serif TC", serif;
        --font-body: "Noto Sans TC", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--color-bg);
        color: var(--color-ink);
        font-family: var(--font-body);
      }

      body {
        background-image:
          radial-gradient(
            circle at 15% 0%,
            rgba(169, 124, 47, 0.08),
            transparent 45%
          ),
          radial-gradient(
            circle at 85% 100%,
            rgba(122, 30, 46, 0.06),
            transparent 45%
          );
        min-height: 100vh;
        padding: 32px 16px 64px;
      }

      .wrap {
        max-width: 920px;
        margin: 0 auto;
      }

      header.hero {
        text-align: center;
        padding: 8px 0 28px;
        border-bottom: 1px solid var(--color-gold-light);
        margin-bottom: 28px;
      }
      .hero .kicker {
        font-family: var(--font-body);
        font-size: 13px;
        letter-spacing: 0.14em;
        color: var(--color-wine);
        margin-bottom: 10px;
      }
      .hero h1 {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: clamp(30px, 5.4vw, 46px);
        margin: 0 0 8px;
        color: var(--color-wine-dark);
        line-height: 1.25;
      }
      .hero p.sub {
        font-size: 14px;
        color: var(--color-ink-soft);
        margin: 0;
      }

      .tabs {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-bottom: 22px;
      }
      .tab-btn {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 17px;
        background: none;
        border: none;
        padding: 10px 22px;
        color: var(--color-ink-soft);
        cursor: pointer;
        position: relative;
        border-bottom: 3px solid transparent;
        transition:
          color 0.2s ease,
          border-color 0.2s ease;
      }
      .tab-btn:hover {
        color: var(--color-wine);
      }
      .tab-btn.active {
        color: var(--color-wine-dark);
        border-bottom-color: var(--color-gold-bright);
      }
      .tab-progress {
        display: block;
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--color-ink-soft);
        margin-top: 2px;
      }

      .factory-panel {
        display: none;
      }
      .factory-panel.active {
        display: block;
      }

      details.roster {
        background: var(--color-panel);
        border: 1px solid var(--color-gold-light);
        border-radius: 4px;
        padding: 14px 18px;
        margin-bottom: 22px;
      }
      details.roster summary {
        cursor: pointer;
        font-weight: 700;
        font-size: 14px;
        color: var(--color-wine-dark);
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      details.roster summary::-webkit-details-marker {
        display: none;
      }
      summary .marker {
        color: var(--color-gold);
        font-size: 12px;
      }
      .roster-body {
        margin-top: 14px;
      }
      .roster-body textarea {
        width: 100%;
        min-height: 140px;
        resize: vertical;
        font-family: var(--font-body);
        font-size: 13px;
        line-height: 1.6;
        padding: 10px 12px;
        border: 1px solid #ddd0b4;
        border-radius: 3px;
        background: #fffefb;
        color: var(--color-ink);
      }
      .roster-body textarea:focus {
        outline: 2px solid var(--color-gold-bright);
        outline-offset: 1px;
      }
      .roster-hint {
        font-size: 12px;
        color: var(--color-ink-soft);
        margin: 8px 0 12px;
      }
      .roster-actions {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .btn {
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 13px;
        padding: 9px 18px;
        border-radius: 3px;
        border: 1px solid var(--color-wine);
        background: var(--color-wine);
        color: #fbf3e4;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          background 0.15s ease;
      }
      .btn:hover {
        background: var(--color-wine-dark);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn.ghost {
        background: transparent;
        color: var(--color-wine);
      }
      .btn.ghost:hover {
        background: rgba(122, 30, 46, 0.06);
      }
      .btn.small {
        padding: 5px 12px;
        font-size: 12px;
      }

      .count-badge {
        font-size: 12px;
        color: var(--color-ink-soft);
      }
      .count-badge b {
        color: var(--color-wine-dark);
        font-size: 14px;
      }

      .prize-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
      }
      .prize-card {
        background: var(--color-panel);
        border: 1px solid var(--color-gold-light);
        border-radius: 4px;
        padding: 18px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        position: relative;
      }
      .prize-card.won {
        border-color: var(--color-wine);
      }
      .prize-card.drawing {
        border-color: var(--color-gold-bright);
        box-shadow: 0 0 0 3px rgba(214, 169, 74, 0.18);
      }
      .prize-name-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .prize-name-input {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 17px;
        color: var(--color-wine-dark);
        border: none;
        border-bottom: 1px dashed transparent;
        background: transparent;
        padding: 2px 0;
        width: 100%;
      }
      .prize-name-input:hover,
      .prize-name-input:focus {
        border-bottom-color: var(--color-gold-light);
        outline: none;
      }
      .remove-prize {
        background: none;
        border: none;
        color: var(--color-ink-soft);
        font-size: 15px;
        cursor: pointer;
        line-height: 1;
        padding: 2px 4px;
      }
      .remove-prize:hover {
        color: var(--color-wine);
      }
      .prize-qty-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--color-ink-soft);
      }
      .prize-qty-input {
        width: 48px;
        padding: 3px 6px;
        border: 1px solid #ddd0b4;
        border-radius: 3px;
        background: #fffefb;
        color: var(--color-ink);
        font-family: var(--font-body);
        font-size: 12px;
        text-align: center;
      }
      .stage .winner-list {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 16px;
        color: var(--color-gold-bright);
        line-height: 1.6;
        animation: reveal 0.4s ease;
      }

      .stage {
        background: var(--color-wine-dark);
        border-radius: 3px;
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 8px;
        text-align: center;
      }
      .stage .placeholder {
        color: rgba(251, 243, 228, 0.55);
        font-size: 12px;
      }
      .stage .rolling {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 19px;
        color: var(--color-gold-light);
        letter-spacing: 0.03em;
      }
      .stage .winner {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 22px;
        color: var(--color-gold-bright);
        animation: reveal 0.4s ease;
      }
      @keyframes reveal {
        0% {
          transform: scale(0.7);
          opacity: 0;
        }
        60% {
          transform: scale(1.08);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .prize-actions {
        display: flex;
        gap: 8px;
      }
      .prize-actions .btn {
        flex: 1;
      }

      .add-prize-row {
        text-align: center;
        margin: -6px 0 26px;
      }

      .summary {
        background: var(--color-panel);
        border: 1px solid var(--color-gold-light);
        border-radius: 4px;
        padding: 18px 20px;
        margin-top: 30px;
      }
      .summary h2 {
        font-family: var(--font-display);
        font-size: 18px;
        color: var(--color-wine-dark);
        margin: 0 0 12px;
      }
      table.results-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      table.results-table th,
      table.results-table td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--color-bg-alt);
      }
      table.results-table th {
        color: var(--color-ink-soft);
        font-weight: 500;
        font-size: 12px;
      }
      table.results-table td.winner-name {
        font-weight: 700;
        color: var(--color-wine-dark);
      }
      .empty-row td {
        color: var(--color-ink-soft);
        font-style: normal;
      }

      .summary-actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      .banner-done {
        margin-top: 14px;
        padding: 10px 14px;
        background: var(--color-gold-light);
        color: var(--color-wine-dark);
        border-radius: 3px;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
      }

      footer.note {
        text-align: center;
        font-size: 11px;
        color: var(--color-ink-soft);
        margin-top: 26px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <h1>2026服務廠微笑大使　幸運抽獎</h1>
        <p class="sub">貼上名單，逐一抽出中壢廠與八德廠的幸運得主</p>
      </header>

      <div class="tabs" id="tabs"></div>

      <div id="panels"></div>

      <section class="summary">
        <h2>得獎總表</h2>
        <table class="results-table">
          <thead>
            <tr>
              <th style="width: 20%">分廠</th>
              <th style="width: 40%">獎項</th>
              <th>得獎人</th>
            </tr>
          </thead>
          <tbody id="summary-body"></tbody>
        </table>
        <div id="done-banner"></div>
        <div class="summary-actions">
          <button class="btn ghost small" id="copy-btn">複製得獎名單</button>
          <button class="btn ghost small" id="reset-results-btn">
            重置抽獎結果
          </button>
          <button class="btn ghost small" id="reset-all-btn">
            清空全部資料
          </button>
        </div>
      </section>

      <footer class="note">
        名單與抽獎結果會保留在此瀏覽器中，重新整理頁面不會遺失。
      </footer>
    </div>

    <script>
      (function () {
        const FACTORY_KEYS = ["zhongli", "bade"];
        const FACTORY_LABELS = { zhongli: "中壢廠", bade: "八德廠" };

        const DEFAULT_PRIZES = [
          { id: "p_xiangzu", name: "擴香組", quantity: 1 },
          { id: "p_cup", name: "保溫隨行杯", quantity: 1 },
          { id: "p_blanket", name: "百週年抱枕毯", quantity: 1 },
        ];

        let state = {
          activeFactory: "zhongli",
          factories: {
            zhongli: { people: [] },
            bade: { people: [] },
          },
          prizes: DEFAULT_PRIZES.map((p) => ({ ...p })),
          results: {
            zhongli: {},
            bade: {},
          },
        };

        function saveState() {
          try {
            localStorage.setItem("lottery-state", JSON.stringify(state));
          } catch (e) {
            console.warn("save failed", e);
          }
        }
        function loadState() {
          try {
            const raw = localStorage.getItem("lottery-state");
            if (raw) {
              const data = JSON.parse(raw);
              if (data.factories) state.factories = data.factories;
              if (data.prizes) {
                state.prizes = data.prizes.map((p) => ({
                  quantity: 1,
                  ...p,
                }));
              }
              if (data.results) {
                const migrated = {};
                FACTORY_KEYS.forEach((k) => {
                  const factoryResults = data.results[k] || {};
                  migrated[k] = {};
                  Object.keys(factoryResults).forEach((prizeId) => {
                    const val = factoryResults[prizeId];
                    migrated[k][prizeId] = Array.isArray(val)
                      ? val
                      : val
                        ? [val]
                        : [];
                  });
                });
                state.results = migrated;
              }
              if (data.activeFactory) state.activeFactory = data.activeFactory;
            }
          } catch (e) {
            /* nothing saved yet */
          }
        }

        function parseNames(text) {
          const parts = text
            .split(/[\n,、，]+/)
            .map((s) => s.trim())
            .filter(Boolean);
          return Array.from(new Set(parts));
        }

        function getPool(factoryKey) {
          const won = Object.values(state.results[factoryKey] || {}).flat();
          return state.factories[factoryKey].people.filter(
            (n) => !won.includes(n),
          );
        }

        function drawnCount(factoryKey) {
          return Object.values(state.results[factoryKey] || {}).reduce(
            (sum, arr) => sum + (arr ? arr.length : 0),
            0,
          );
        }

        function totalSlots() {
          return state.prizes.reduce((sum, p) => sum + (p.quantity || 1), 0);
        }

        function escapeHtml(str) {
          const div = document.createElement("div");
          div.textContent = str;
          return div.innerHTML;
        }

        function render() {
          renderTabs();
          renderPanels();
          renderSummary();
        }

        function renderTabs() {
          const tabs = document.getElementById("tabs");
          tabs.innerHTML = "";
          FACTORY_KEYS.forEach((key) => {
            const btn = document.createElement("button");
            btn.className =
              "tab-btn" + (state.activeFactory === key ? " active" : "");
            btn.innerHTML =
              FACTORY_LABELS[key] +
              '<span class="tab-progress">' +
              drawnCount(key) +
              " / " +
              totalSlots() +
              " 已抽出</span>";
            btn.addEventListener("click", () => {
              state.activeFactory = key;
              saveState();
              render();
            });
            tabs.appendChild(btn);
          });
        }

        function renderPanels() {
          const panels = document.getElementById("panels");
          panels.innerHTML = "";
          FACTORY_KEYS.forEach((key) => {
            const panel = document.createElement("div");
            panel.className =
              "factory-panel" + (state.activeFactory === key ? " active" : "");
            panel.appendChild(buildRoster(key));
            panel.appendChild(buildPrizeGrid(key));
            panels.appendChild(panel);
          });
        }

        function buildRoster(key) {
          const details = document.createElement("details");
          details.className = "roster";
          details.open = state.factories[key].people.length === 0;

          const summary = document.createElement("summary");
          summary.innerHTML =
            "<span>" +
            FACTORY_LABELS[key] +
            '　名單管理</span><span class="marker">展開 / 收合</span>';
          details.appendChild(summary);

          const body = document.createElement("div");
          body.className = "roster-body";

          const hint = document.createElement("p");
          hint.className = "roster-hint";
          hint.textContent =
            "每行貼上一位人員姓名（也支援逗號分隔），可容納數百筆，貼上後按「更新名單」套用。";
          body.appendChild(hint);

          const textarea = document.createElement("textarea");
          textarea.placeholder = "例如：\n王小明\n陳美玲\n林大衛\n...";
          textarea.value = state.factories[key].people.join("\n");
          body.appendChild(textarea);

          const actions = document.createElement("div");
          actions.className = "roster-actions";
          actions.style.marginTop = "10px";

          const updateBtn = document.createElement("button");
          updateBtn.className = "btn";
          updateBtn.textContent = "更新名單";
          updateBtn.addEventListener("click", () => {
            const names = parseNames(textarea.value);
            state.factories[key].people = names;
            saveState();
            render();
          });
          actions.appendChild(updateBtn);

          const badge = document.createElement("span");
          badge.className = "count-badge";
          badge.innerHTML =
            "目前名單共 <b>" + state.factories[key].people.length + "</b> 人";
          actions.appendChild(badge);

          body.appendChild(actions);
          details.appendChild(body);
          return details;
        }

        function buildPrizeGrid(key) {
          const wrap = document.createElement("div");

          const grid = document.createElement("div");
          grid.className = "prize-grid";

          state.prizes.forEach((prize) => {
            grid.appendChild(buildPrizeCard(key, prize));
          });
          wrap.appendChild(grid);

          const addRow = document.createElement("div");
          addRow.className = "add-prize-row";
          const addBtn = document.createElement("button");
          addBtn.className = "btn ghost small";
          addBtn.textContent = "＋ 新增獎項";
          addBtn.addEventListener("click", () => {
            const newPrize = { id: "p_" + Date.now(), name: "新獎項" };
            state.prizes.push(newPrize);
            saveState();
            render();
          });
          addRow.appendChild(addBtn);
          wrap.appendChild(addRow);

          return wrap;
        }

        function buildPrizeCard(factoryKey, prize) {
          const card = document.createElement("div");
          card.className = "prize-card";
          const quantity = prize.quantity || 1;
          const winners =
            (state.results[factoryKey] &&
              state.results[factoryKey][prize.id]) ||
            [];
          const isFull = winners.length >= quantity;
          if (isFull) card.classList.add("won");

          const nameRow = document.createElement("div");
          nameRow.className = "prize-name-row";

          const nameInput = document.createElement("input");
          nameInput.className = "prize-name-input";
          nameInput.value = prize.name;
          nameInput.addEventListener("change", () => {
            prize.name = nameInput.value.trim() || prize.name;
            saveState();
            renderSummary();
          });
          nameRow.appendChild(nameInput);

          const removeBtn = document.createElement("button");
          removeBtn.className = "remove-prize";
          removeBtn.title = "刪除此獎項";
          removeBtn.textContent = "✕";
          removeBtn.addEventListener("click", () => {
            if (
              !confirm(
                "確定要刪除「" +
                  prize.name +
                  "」這個獎項嗎？兩廠已抽出的結果也會一併移除。",
              )
            )
              return;
            state.prizes = state.prizes.filter((p) => p.id !== prize.id);
            FACTORY_KEYS.forEach((k) => {
              delete state.results[k][prize.id];
            });
            saveState();
            render();
          });
          nameRow.appendChild(removeBtn);

          card.appendChild(nameRow);

          const qtyRow = document.createElement("div");
          qtyRow.className = "prize-qty-row";
          const qtyLabel1 = document.createElement("span");
          qtyLabel1.textContent = "每廠抽出";
          const qtyInput = document.createElement("input");
          qtyInput.type = "number";
          qtyInput.min = "1";
          qtyInput.className = "prize-qty-input";
          qtyInput.value = quantity;
          qtyInput.addEventListener("change", () => {
            let n = parseInt(qtyInput.value, 10);
            if (!n || n < 1) n = 1;
            const currentWinners =
              (state.results[factoryKey] &&
                state.results[factoryKey][prize.id]) ||
              [];
            if (n < currentWinners.length) {
              if (
                !confirm(
                  "目前「" +
                    prize.name +
                    "」已經抽出 " +
                    currentWinners.length +
                    " 位，調降人數會清除已抽出的名單，確定要調整嗎？",
                )
              ) {
                qtyInput.value = prize.quantity || 1;
                return;
              }
              FACTORY_KEYS.forEach((k) => {
                if (state.results[k] && state.results[k][prize.id]) {
                  state.results[k][prize.id] = [];
                }
              });
            }
            prize.quantity = n;
            saveState();
            render();
          });
          const qtyLabel2 = document.createElement("span");
          qtyLabel2.textContent = "人";
          qtyRow.appendChild(qtyLabel1);
          qtyRow.appendChild(qtyInput);
          qtyRow.appendChild(qtyLabel2);
          card.appendChild(qtyRow);

          const stage = document.createElement("div");
          stage.className = "stage";
          stage.id = "stage-" + factoryKey + "-" + prize.id;
          if (winners.length > 0) {
            stage.innerHTML =
              '<span class="winner-list">🏆 ' +
              winners.map((w) => escapeHtml(w)).join("、") +
              "</span>";
          } else {
            stage.innerHTML = '<span class="placeholder">尚未抽出</span>';
          }
          card.appendChild(stage);

          const actions = document.createElement("div");
          actions.className = "prize-actions";

          const pool = getPool(factoryKey);
          const drawBtn = document.createElement("button");
          drawBtn.className = "btn";
          drawBtn.textContent = isFull
            ? "重新抽獎"
            : quantity > 1
              ? "開始抽獎（抽出 " + quantity + " 人）"
              : "開始抽獎";
          drawBtn.disabled = drawingLock || (!isFull && pool.length === 0);
          drawBtn.addEventListener("click", () => {
            if (isFull) {
              if (
                !confirm(
                  "「" +
                    prize.name +
                    "」（" +
                    FACTORY_LABELS[factoryKey] +
                    "）已抽出 " +
                    winners.join("、") +
                    "，確定要清空並重新抽獎嗎？",
                )
              )
                return;
              state.results[factoryKey][prize.id] = [];
              saveState();
              render();
              return;
            }
            runDraw(factoryKey, prize, card, stage);
          });
          actions.appendChild(drawBtn);

          card.appendChild(actions);

          if (!isFull && pool.length === 0) {
            const warn = document.createElement("div");
            warn.style.fontSize = "11px";
            warn.style.color = "var(--color-ink-soft)";
            warn.textContent = "名單已抽完或尚未匯入，請先於上方更新名單";
            card.appendChild(warn);
          }

          return card;
        }

        let drawingLock = false;

        function runDraw(factoryKey, prize, cardEl, stageEl) {
          const already =
            (state.results[factoryKey] &&
              state.results[factoryKey][prize.id]) ||
            [];
          const remaining = (prize.quantity || 1) - already.length;
          const pool = getPool(factoryKey);
          if (remaining <= 0 || pool.length === 0 || drawingLock) return;

          const drawCount = Math.min(remaining, pool.length);
          const shuffled = [...pool].sort(() => Math.random() - 0.5);
          const finalWinners = shuffled.slice(0, drawCount);

          drawingLock = true;
          cardEl.classList.add("drawing");
          document
            .querySelectorAll(".prize-actions .btn")
            .forEach((b) => (b.disabled = true));

          let ticks = 0;
          const maxTicks = 14;
          let delay = 55;

          function tick() {
            const preview = [...pool]
              .sort(() => Math.random() - 0.5)
              .slice(0, drawCount);
            stageEl.innerHTML =
              '<span class="winner-list rolling">' +
              preview.map((n) => escapeHtml(n)).join("、") +
              "</span>";
            ticks++;
            if (ticks < maxTicks) {
              delay = delay + (ticks > maxTicks - 6 ? 22 : 6);
              setTimeout(tick, delay);
            } else {
              finishDraw();
            }
          }

          function finishDraw() {
            if (!state.results[factoryKey][prize.id]) {
              state.results[factoryKey][prize.id] = [];
            }
            state.results[factoryKey][prize.id].push(...finalWinners);
            drawingLock = false;
            saveState();
            render();
          }

          tick();
        }

        function renderSummary() {
          const body = document.getElementById("summary-body");
          body.innerHTML = "";
          let anyRow = false;

          FACTORY_KEYS.forEach((key) => {
            state.prizes.forEach((prize) => {
              const winners =
                (state.results[key] && state.results[key][prize.id]) || [];
              if (winners.length === 0) {
                const tr = document.createElement("tr");
                tr.innerHTML =
                  "<td>" +
                  FACTORY_LABELS[key] +
                  "</td>" +
                  "<td>" +
                  escapeHtml(prize.name) +
                  "</td>" +
                  "<td>尚未抽出</td>";
                body.appendChild(tr);
              } else {
                winners.forEach((winner) => {
                  const tr = document.createElement("tr");
                  tr.innerHTML =
                    "<td>" +
                    FACTORY_LABELS[key] +
                    "</td>" +
                    "<td>" +
                    escapeHtml(prize.name) +
                    "</td>" +
                    '<td class="winner-name">' +
                    escapeHtml(winner) +
                    "</td>";
                  body.appendChild(tr);
                });
              }
              anyRow = true;
            });
          });

          if (!anyRow) {
            const tr = document.createElement("tr");
            tr.className = "empty-row";
            tr.innerHTML = '<td colspan="3">尚未設定任何獎項</td>';
            body.appendChild(tr);
          }

          const totalPrizes = totalSlots() * FACTORY_KEYS.length;
          const totalDrawn = FACTORY_KEYS.reduce(
            (sum, k) => sum + drawnCount(k),
            0,
          );
          const bannerEl = document.getElementById("done-banner");
          if (totalPrizes > 0 && totalDrawn === totalPrizes) {
            bannerEl.innerHTML =
              '<div class="banner-done">🎉 兩廠獎項皆已抽出，恭喜所有得獎粉絲！</div>';
          } else {
            bannerEl.innerHTML = "";
          }
        }

        document
          .getElementById("copy-btn")
          .addEventListener("click", async () => {
            const lines = [];
            FACTORY_KEYS.forEach((key) => {
              state.prizes.forEach((prize) => {
                const winners =
                  (state.results[key] && state.results[key][prize.id]) || [];
                if (winners.length === 0) {
                  lines.push(
                    FACTORY_LABELS[key] + "｜" + prize.name + "｜尚未抽出",
                  );
                } else {
                  winners.forEach((winner) => {
                    lines.push(
                      FACTORY_LABELS[key] + "｜" + prize.name + "｜" + winner,
                    );
                  });
                }
              });
            });
            const text = lines.join("\n");
            try {
              await navigator.clipboard.writeText(text);
              const btn = document.getElementById("copy-btn");
              const original = btn.textContent;
              btn.textContent = "已複製！";
              setTimeout(() => {
                btn.textContent = original;
              }, 1500);
            } catch (e) {
              alert("複製失敗，請手動選取複製：\n\n" + text);
            }
          });

        document
          .getElementById("reset-results-btn")
          .addEventListener("click", () => {
            if (!confirm("確定要清除所有抽獎結果嗎？名單資料會保留。")) return;
            state.results = { zhongli: {}, bade: {} };
            saveState();
            render();
          });

        document
          .getElementById("reset-all-btn")
          .addEventListener("click", () => {
            if (
              !confirm("確定要清空所有名單、獎項與抽獎結果嗎？此動作無法復原。")
            )
              return;
            state = {
              activeFactory: "zhongli",
              factories: { zhongli: { people: [] }, bade: { people: [] } },
              prizes: DEFAULT_PRIZES.map((p) => ({ ...p })),
              results: { zhongli: {}, bade: {} },
            };
            saveState();
            render();
          });

        loadState();
        render();
      })();
    </script>
  </body>
</html>
